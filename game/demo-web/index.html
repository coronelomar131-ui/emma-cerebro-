<meta name="claude:viewport-fit-sides" content="cover">
<title>Zomboide Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{
  /* Una sola pantalla de juego: lienzo a pantalla completa, HUD arriba a la izquierda, botones abajo a la derecha. */
  --ink:#0d1210; --panel:rgba(12,18,14,.72); --line:rgba(220,230,210,.22);
  --text:#e6ecdc; --muted:#9aa890; --hp:#d8554a; --food:#d9a441; --water:#4a9fd8; --stam:#7fc46a;
  --btn:rgba(30,42,32,.82); --btn-on:#5d8a4a;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;display:grid;gap:5px;width:min(220px,50vw)}
.bar{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:6px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bar i{display:block;height:9px;background:var(--panel);border:1px solid var(--line);position:relative}
.bar b{position:absolute;inset:0 auto 0 0;width:100%;background:var(--c)}
#inv,#clock{font-size:16px;font-weight:500;background:var(--panel);padding:4px 8px;border:1px solid var(--line);line-height:1.25}
#clock{font-weight:700}
#bleed{color:var(--hp);font-weight:700}
#toast{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:6px 14px;font-size:18px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#btns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,84px);gap:8px;justify-items:stretch}
#btns button{font:700 17px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text);background:var(--btn);border:1px solid var(--line);padding:0;height:46px;touch-action:none}
#btns button:active,#btns button.on{background:var(--btn-on)}
#btns #b-atk{grid-column:1/3;height:64px;font-size:22px;background:#6b2d27}
#btns #b-atk:active{background:#a8453b}
#btns button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#veil{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:rgba(8,12,9,.88);padding:24px;z-index:5}
#veil[hidden]{display:none}
#veil h1{margin:0;font-size:clamp(40px,12vw,78px);letter-spacing:.08em;text-transform:uppercase;line-height:.95;text-wrap:balance}
#veil p{margin:0;color:var(--muted);font-size:19px;max-width:30ch;justify-self:center;line-height:1.3}
#veil button{font:700 24px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--text);border:0;padding:14px 34px;justify-self:center}
#veil button:focus-visible{outline:2px solid var(--water);outline-offset:3px}
@media (max-height:420px){#btns{grid-template-columns:repeat(3,70px)}#btns button{height:38px;font-size:14px}#btns #b-atk{grid-column:1/4;height:48px}}
</style>

<canvas id="cv" aria-label="Zona de juego"></canvas>
<div id="hud">
  <div class="bar" style="--c:var(--hp)">Vida<i><b id="v-hp"></b></i></div>
  <div class="bar" style="--c:var(--food)">Hambre<i><b id="v-food"></b></i></div>
  <div class="bar" style="--c:var(--water)">Sed<i><b id="v-water"></b></i></div>
  <div class="bar" style="--c:var(--stam)">Energía<i><b id="v-stam"></b></i></div>
  <div id="inv"></div>
  <div id="clock"></div>
</div>
<div id="toast"></div>
<div id="btns">
  <button id="b-atk">Atacar</button>
  <button id="b-take">Recoger</button>
  <button id="b-run">Correr</button>
  <button id="b-eat">Comer</button>
  <button id="b-drink">Beber</button>
  <button id="b-bandage">Vendar</button>
  <button id="b-craft">Hacer venda</button>
</div>
<div id="veil">
  <h1 id="v-title">Zomboide</h1>
  <p id="v-text">Sobrevive. Saquea casas, no hagas ruido y no te dejes morder. Joystick a la izquierda, botones a la derecha. En PC: WASD, Shift, Espacio, E, C y 1-2-3.</p>
  <button id="v-go">Jugar</button>
</div>

<script>
(()=>{
const WORLD=3200, SAVE='zomboide-demo-v1';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,Z=1;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);Z=Math.max(1.1,Math.min(W,H)/340);}
addEventListener('resize',resize);resize();

// ---- azar con semilla ----
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const rr=(a,b)=>a+R()*(b-a);

// ---- sprites pixel art (16x16, miran a la derecha) ----
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c};
const px=(g,c,x,y,w=1,h=1)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
function person(body,skin,hair,fwd){return mk(16,16,g=>{
  px(g,'#141414',3,3,10,10);px(g,body,4,4,8,8);px(g,'#141414',6,5,6,6);px(g,skin,7,6,4,4);px(g,hair,6,6,2,4);
  if(fwd){px(g,skin,12,4,3,2);px(g,skin,12,10,3,2)}else{px(g,skin,11,4,2,2);px(g,skin,11,10,2,2)}})}
const SP={player:person('#3c6ec8','#f0c8a0','#46281a',false),zombie:person('#5a6e46','#82a064','#28321e',true),
 crate:mk(16,16,g=>{px(g,'#281c0f',2,3,12,11);px(g,'#b47d32',3,4,10,9);px(g,'#281c0f',3,8,10,1);px(g,'#281c0f',7,4,1,9)}),
 open:mk(16,16,g=>{px(g,'#281c0f',2,3,12,11);px(g,'#50402d',3,4,10,9);px(g,'#281c0f',4,6,8,1)})};
function tile(base,dots,fn){return mk(16,16,g=>{px(g,base,0,0,16,16);const r=rng(7);for(let i=0;i<dots.n;i++)px(g,dots.c[(r()*dots.c.length)|0],(r()*16)|0,(r()*16)|0);if(fn)fn(g)})}
function pat(t){const big=mk(64,64,g=>{g.imageSmoothingEnabled=false;g.drawImage(t,0,0,64,64)});return ctx.createPattern(big,'repeat')}
const P={grass:pat(tile('#34562d',{n:16,c:['#2c4a26','#406434']})),
 floor:pat(tile('#785c40',{n:0,c:['#000']},g=>{for(let y=0;y<16;y+=4)px(g,'#624a32',0,y,16,1)})),
 wall:pat(tile('#42342e',{n:0,c:['#000']},g=>{for(let y=0;y<16;y+=4){px(g,'#28201c',0,y,16,1);for(let x=(y%8);x<16;x+=8)px(g,'#28201c',x,y,1,4)}}))};

// ---- estado ----
let started=false,S,walls,houses,crates,zombies,seed,spawnT,saveT,toastT,last=0,running=false,swing=0,hudT=0;
const keys={};
const joy={id:null,ox:0,oy:0,x:0,y:0,vx:0,vy:0};
let wantRun=false;

function blocked(x,y,r){if(x<r||y<r||x>WORLD-r||y>WORLD-r)return true;
  for(const w of walls)if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return true;return false}
function slide(e,dx,dy,r){if(!blocked(e.x+dx,e.y,r))e.x+=dx;if(!blocked(e.x,e.y+dy,r))e.y+=dy}

function build(sd){
  seed=sd;R=rng(sd);walls=[];houses=[];crates=[];zombies=[];
  const c=WORLD/2,far=(d)=>{let x,y,n=0;do{x=rr(150,WORLD-150);y=rr(150,WORLD-150);n++}while(Math.hypot(x-c,y-c)<d&&n<30);return[x,y]};
  for(let i=0;i<16;i++){const[x,y]=far(350),w=220,h=180,t=12,d=60,half=(w-d)/2;
    houses.push({x,y,w,h});
    walls.push({x,y,w,h:t},{x,y:y+t,w:t,h:h-t},{x:x+w-t,y:y+t,w:t,h:h-t},{x:x+t,y:y+h-t,w:half-t,h:t},{x:x+half+d,y:y+h-t,w:half-t,h:t});
    const n=1+((R()*3)|0);for(let k=0;k<n;k++)crates.push({x:x+rr(40,w-60),y:y+rr(30,h-50),rich:2,done:false})}
  for(let i=0;i<25;i++){const[x,y]=far(150);crates.push({x,y,rich:1,done:false})}
  for(let i=0;i<45;i++){const[x,y]=far(500);addZombie(x,y)}
  R=Math.random;
}
function addZombie(x,y){if(blocked(x,y,10))return;zombies.push({x,y,hp:3,sp:70*rr(.8,1.15),vx:0,vy:0,kx:0,ky:0,ang:0,cd:0,wt:0,wx:0,wy:0,flash:0})}

function newGame(load){
  let data=null;
  if(load){try{data=JSON.parse(localStorage.getItem(SAVE))}catch(e){}}
  build(data&&data.seed?data.seed:(Math.random()*2**31)|0);
  S={x:WORLD/2,y:WORLD/2,health:100,hunger:100,thirst:100,energy:100,bleeding:false,bat:0,
     items:{comida:2,agua:2,venda:1,trapo:0},hour:8,total:0,fx:1,fy:0,noise:60,cd:0,dead:false};
  if(data&&data.s)Object.assign(S,data.s);
  spawnT=6;saveT=20;toastT=0;swing=0;
}
function save(){if(S.dead)return;try{localStorage.setItem(SAVE,JSON.stringify({seed,s:S}))}catch(e){}}
function wipe(){try{localStorage.removeItem(SAVE)}catch(e){}}

// ---- acciones ----
function toast(m){if(!m)return;const t=$('toast');t.textContent=m;t.classList.add('on');toastT=2.4}
function attack(){if(S.dead||S.cd>0||S.energy<5)return;S.cd=.5;S.energy-=5;S.noise=Math.max(S.noise,350);swing=.15;
  const armed=S.bat>0,reach=armed?60:48;let hit=false;
  for(const z of zombies){const dx=z.x-S.x,dy=z.y-S.y,d=Math.hypot(dx,dy);
    if(d<reach&&(dx*S.fx+dy*S.fy)/(d||1)>.3){z.hp-=armed?2:1;z.kx=S.fx*220;z.ky=S.fy*220;z.flash=.2;hit=true}}
  if(armed&&hit)S.bat--;zombies=zombies.filter(z=>z.hp>0)}
function use(k){if(S.dead||!S.items[k])return;S.items[k]--;
  if(k==='comida')S.hunger=Math.min(100,S.hunger+35);
  if(k==='agua')S.thirst=Math.min(100,S.thirst+40);
  if(k==='venda'){if(S.bleeding){S.bleeding=false;S.health=Math.min(100,S.health+10)}else S.health=Math.min(100,S.health+25)}}
function craft(){if(S.items.trapo<2)return toast('Necesitas 2 trapos');S.items.trapo-=2;S.items.venda++;toast('Hiciste una venda')}
function take(){if(S.dead)return;
  for(const c of crates){if(c.done)continue;if(Math.hypot(c.x+8-S.x,c.y+8-S.y)<44){c.done=true;const f=[];
    for(const it of ['comida','agua','venda','bate','trapo']){if(Math.random()<(it==='bate'?.08:.25)*c.rich){if(it==='bate')S.bat=30;else S.items[it]++;f.push(it)}}
    return toast(f.length?'Encontraste: '+f.join(', '):'Estaba vacío')}}
  toast('No hay nada cerca')}

// ---- entrada ----
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;
  if(!running)return;
  if(e.code==='Space'){attack();e.preventDefault()}
  else if(e.code==='KeyE')take();else if(e.code==='KeyC')craft();
  else if(e.code==='Digit1')use('comida');else if(e.code==='Digit2')use('agua');else if(e.code==='Digit3')use('venda')});
addEventListener('keyup',e=>{keys[e.code]=0});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){if(running)attack();return}
  if(joy.id===null&&e.clientX<cv.getBoundingClientRect().width*.55){joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;joy.vx=joy.vy=0;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;joy.x=e.clientX;joy.y=e.clientY;
  let dx=(joy.x-joy.ox)/48,dy=(joy.y-joy.oy)/48;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.vx=dx;joy.vy=dy});
const endJoy=e=>{if(e.pointerId===joy.id){joy.id=null;joy.vx=joy.vy=0}};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
const bind=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();if(running)fn()});
bind('b-atk',attack);bind('b-take',take);bind('b-eat',()=>use('comida'));bind('b-drink',()=>use('agua'));
bind('b-bandage',()=>use('venda'));bind('b-craft',craft);
bind('b-run',()=>{wantRun=!wantRun;$('b-run').classList.toggle('on',wantRun)});
document.addEventListener('contextmenu',e=>e.preventDefault());

// ---- simulación ----
function update(dt){
  S.cd=Math.max(0,S.cd-dt);swing=Math.max(0,swing-dt);
  let ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.vx;
  let ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.vy;
  const l=Math.hypot(ax,ay);if(l>1){ax/=l;ay/=l}
  const moving=l>.1,run=moving&&S.energy>5&&(wantRun||keys.ShiftLeft||keys.ShiftRight);
  let sp=run?240:140;if(S.health<30||S.energy<10)sp*=.6;
  slide(S,ax*sp*dt,ay*sp*dt,10);
  if(moving){S.fx=ax/l;S.fy=ay/l}
  if(run){S.energy=Math.max(0,S.energy-12*dt);S.noise=450}
  else if(moving){S.energy=Math.min(100,S.energy+3*dt);S.noise=200}
  else{S.energy=Math.min(100,S.energy+9*dt);S.noise=60}
  S.hunger=Math.max(0,S.hunger-.15*dt);S.thirst=Math.max(0,S.thirst-.25*dt);
  if(S.bleeding)hurt(.8*dt);
  if(S.hunger<=0||S.thirst<=0)hurt(dt);
  else if(S.hunger>50&&S.thirst>50&&!S.bleeding)S.health=Math.min(100,S.health+.3*dt);

  S.hour=(S.hour+dt/40)%24;S.total+=dt/40;
  if(night()){spawnT-=dt;if(spawnT<=0&&zombies.length<70){spawnT=6;const a=Math.random()*6.283;
    addZombie(Math.min(WORLD-50,Math.max(50,S.x+Math.cos(a)*700)),Math.min(WORLD-50,Math.max(50,S.y+Math.sin(a)*700)))}}
  saveT-=dt;if(saveT<=0){saveT=20;save()}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on')}

  for(const z of zombies){
    z.cd=Math.max(0,z.cd-dt);z.flash=Math.max(0,z.flash-dt);
    const dx=S.x-z.x,dy=S.y-z.y,d=Math.hypot(dx,dy);let mx=0,my=0;
    if(d<Math.max(S.noise,150)){mx=dx/d;my=dy/d;if(d<26&&z.cd<=0){z.cd=1;hurt(10);if(Math.random()<.35)S.bleeding=true}}
    else{z.wt-=dt;if(z.wt<=0){z.wt=rr(1,4);const a=Math.random()*6.283,m=Math.random()<.4?0:.35;z.wx=Math.cos(a)*m;z.wy=Math.sin(a)*m}mx=z.wx;my=z.wy}
    slide(z,(mx*z.sp+z.kx)*dt,(my*z.sp+z.ky)*dt,10);
    const k=Math.max(0,1-600*dt/(Math.hypot(z.kx,z.ky)||1));z.kx*=k;z.ky*=k;
    if(mx||my)z.ang=Math.atan2(my,mx)}
}
const night=()=>S.hour<6||S.hour>=20;
function hurt(a){if(S.dead)return;S.health-=a;if(S.health<=0){S.health=0;S.dead=true;wipe();end()}}
function end(){running=false;$('v-title').textContent='Has muerto';
  $('v-text').textContent='Sobreviviste '+Math.floor(S.total/24)+' días. Hora de la última noche: '+hh()+'.';
  $('v-go').textContent='Reintentar';$('veil').hidden=false}
const hh=()=>String(Math.floor(S.hour)).padStart(2,'0')+':'+String(Math.floor(S.hour%1*60)).padStart(2,'0');

// ---- dibujo ----
function sprite(img,x,y,ang,flash){ctx.save();ctx.translate(x,y);ctx.rotate(ang);if(flash){ctx.globalAlpha=.55}ctx.drawImage(img,-16,-16,32,32);ctx.restore()}
function draw(){
  const cx=Math.max(0,Math.min(WORLD-W/Z,S.x-W/Z/2)),cy=Math.max(0,Math.min(WORLD-H/Z,S.y-H/Z/2));
  const k=Z*dpr;ctx.setTransform(k,0,0,k,-cx*k,-cy*k);ctx.imageSmoothingEnabled=false;
  const vw=W/Z,vh=H/Z,vis=(x,y,w,h)=>x+w>cx&&x<cx+vw&&y+h>cy&&y<cy+vh;
  ctx.fillStyle='#1b2a18';ctx.fillRect(cx-2,cy-2,vw+4,vh+4);
  ctx.fillStyle=P.grass;ctx.fillRect(Math.max(0,cx),Math.max(0,cy),Math.min(vw,WORLD-cx),Math.min(vh,WORLD-cy));
  ctx.fillStyle=P.floor;for(const h of houses)if(vis(h.x,h.y,h.w,h.h))ctx.fillRect(h.x,h.y,h.w,h.h);
  for(const c of crates)if(vis(c.x,c.y,32,32))ctx.drawImage(c.done?SP.open:SP.crate,c.x-8,c.y-8,32,32);
  for(const z of zombies)if(vis(z.x-20,z.y-20,40,40))sprite(SP.zombie,z.x,z.y,z.ang,z.flash>0);
  sprite(SP.player,S.x,S.y,Math.atan2(S.fy,S.fx));
  if(swing>0){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();
    const a=Math.atan2(S.fy,S.fx);ctx.arc(S.x,S.y,S.bat>0?44:34,a-.8,a+.8);ctx.stroke()}
  ctx.fillStyle=P.wall;for(const w of walls)if(vis(w.x,w.y,w.w,w.h))ctx.fillRect(w.x,w.y,w.w,w.h);
  // noche: oscuridad con un círculo de visión alrededor del jugador
  const day=Math.max(0,Math.min(1,Math.cos((S.hour-13)/24*6.2832)+.3)),dark=(1-day)*.82;
  if(dark>.02){ctx.setTransform(dpr,0,0,dpr,0,0);const px_=(S.x-cx)*Z,py_=(S.y-cy)*Z;
    const g=ctx.createRadialGradient(px_,py_,40*Z*.5,px_,py_,230*Z*.5+60);
    g.addColorStop(0,'rgba(8,12,34,'+dark*.25+')');g.addColorStop(1,'rgba(8,12,34,'+dark+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  // joystick
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(joy.id!==null){const r=cv.getBoundingClientRect(),ox=joy.ox-r.left,oy=joy.oy-r.top;
    ctx.fillStyle='rgba(255,255,255,.10)';ctx.beginPath();ctx.arc(ox,oy,48,0,6.283);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(ox+joy.vx*48,oy+joy.vy*48,22,0,6.283);ctx.fill()}
}
function hud(){
  $('v-hp').style.width=S.health+'%';$('v-food').style.width=S.hunger+'%';$('v-water').style.width=S.thirst+'%';$('v-stam').style.width=S.energy+'%';
  const i=S.items;$('inv').innerHTML='Comida '+i.comida+' · Agua '+i.agua+' · Vendas '+i.venda+' · Trapos '+i.trapo+' · Bate '+(S.bat>0?S.bat:'–')+(S.bleeding?'<br><span id="bleed">SANGRANDO: usa una venda</span>':'');
  $('clock').textContent='Día '+(Math.floor(S.total/24)+1)+'  '+hh()+(night()?'  noche':'');
}
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(S){if(running)update(dt);draw();hudT-=dt;if(hudT<=0){hudT=.1;hud()}}
  requestAnimationFrame(frame);
}
function start(){const had=(()=>{try{return !!localStorage.getItem(SAVE)}catch(e){return false}})();
  if(!started||S.dead){newGame(had);started=true}running=true;$('veil').hidden=true;resize()}
$('v-go').addEventListener('click',start);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&running)save()});
newGame(false);draw();hud();
requestAnimationFrame(frame);
})();
</script>
